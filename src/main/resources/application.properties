spring.application.name=BudgetBuddy

#### URL till backend deployed ####

spring.datasource.url=jdbc:postgresql://localhost:5432/budgetbuddy

spring.datasource.username=budgetbuddy
spring.datasource.password=budgetbuddy


spring.datasource.driver-class-name=org.postgresql.Driver

#### JPA CONFIGURATION ####

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect